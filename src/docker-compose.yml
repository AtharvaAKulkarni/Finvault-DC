services:

  clock-master:
    build: .
    container_name: finvault-clock-master
    command: java -cp ".:*" clock_synchronisation.ClockMasterServer
    networks:
      - finvault-network

  finance-server-1:
    build: .
    container_name: finvault-server-1
    command: java -cp ".:*" FinanceServer
    ports:
      - "1234:1234"
    environment:
      NODE_ID: "1"
      PRIMARY_ID: "1"
      CLOCK_DRIFT_MS: "5000"
      CLOCK_MASTER_HOST: "clock-master"
      RMI_HOSTNAME: "finance-server-1"
      NODE_ROLE: "PRIMARY"
      REPLICATION_MANAGER_HOST: "replication-manager"
      NODE1_HOST: "finance-server-1"
      NODE2_HOST: "finance-server-2"
      NODE3_HOST: "finance-server-3"
      NODE4_HOST: "finance-server-4"
    depends_on:
      - clock-master
    networks:
      - finvault-network

  finance-server-2:
    build: .
    container_name: finvault-server-2
    command: java -cp ".:*" FinanceServer
    ports:
      - "1235:1234"
    environment:
      NODE_ID: "2"
      PRIMARY_ID: "1"
      CLOCK_DRIFT_MS: "-3000"
      CLOCK_MASTER_HOST: "clock-master"
      RMI_HOSTNAME: "finance-server-2"
      NODE_ROLE: "SECONDARY"
      REPLICATION_MANAGER_HOST: "replication-manager"
      NODE1_HOST: "finance-server-1"
      NODE2_HOST: "finance-server-2"
      NODE3_HOST: "finance-server-3"
      NODE4_HOST: "finance-server-4"
    depends_on:
      - clock-master
    networks:
      - finvault-network

  finance-server-3:
    build: .
    container_name: finvault-server-3
    command: java -cp ".:*" FinanceServer
    ports:
      - "1236:1234"
    environment:
      NODE_ID: "3"
      PRIMARY_ID: "1"
      CLOCK_DRIFT_MS: "2000"
      CLOCK_MASTER_HOST: "clock-master"
      RMI_HOSTNAME: "finance-server-3"
      NODE_ROLE: "SECONDARY"
      REPLICATION_MANAGER_HOST: "replication-manager"
      NODE1_HOST: "finance-server-1"
      NODE2_HOST: "finance-server-2"
      NODE3_HOST: "finance-server-3"
      NODE4_HOST: "finance-server-4"
    depends_on:
      - clock-master
    networks:
      - finvault-network

  finance-server-4:
    build: .
    container_name: finvault-server-4
    command: java -cp ".:*" FinanceServer
    ports:
      - "1237:1234"
    environment:
      NODE_ID: "4"
      PRIMARY_ID: "1"
      CLOCK_DRIFT_MS: "-1500"
      CLOCK_MASTER_HOST: "clock-master"
      RMI_HOSTNAME: "finance-server-4"
      NODE_ROLE: "SECONDARY"
      REPLICATION_MANAGER_HOST: "replication-manager"
      NODE1_HOST: "finance-server-1"
      NODE2_HOST: "finance-server-2"
      NODE3_HOST: "finance-server-3"
      NODE4_HOST: "finance-server-4"
    depends_on:
      - clock-master
    networks:
      - finvault-network

  replication-manager:
    build: .
    container_name: finvault-replication-manager
    command: java -cp ".:*" replication.ReplicationManagerServer
    environment:
      RMI_HOSTNAME: "replication-manager"
      PRIMARY_ID: "1"
      NODE1_HOST: "finance-server-1"
      NODE2_HOST: "finance-server-2"
      NODE3_HOST: "finance-server-3"
      NODE4_HOST: "finance-server-4"
    depends_on:
      - clock-master
    networks:
      - finvault-network

  load-balancer:
    build: .
    container_name: load-balancer
    environment:
      - RMI_HOSTNAME=localhost
      - LB_STRATEGY=ROUND_ROBIN
      - NODE1_HOST=finance-server-1
      - NODE2_HOST=finance-server-2
      - NODE3_HOST=finance-server-3
      - NODE4_HOST=finance-server-4
      - REPLICATION_MANAGER_HOST=replication-manager
    ports:
      - "8000:8000"
    command: java -cp ".:*" load_balancing.LoadBalancerServer
    depends_on:
      - replication-manager
    networks:
      - finvault-network

networks:
  finvault-network:
    driver: bridge